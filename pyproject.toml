[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emblab"
version = "0.1.0"
description = "Declarative build orchestrator for embedded bootloader/firmware stacks"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
emblab = "emblab.cli:main"

[tool.setuptools.packages.find]
include = ["emblab*"]

[tool.pytest.ini_options]
# workspace/ is gitignored and disposable, but once a build has actually run
# it contains real cloned source trees (e.g. workspace/src/barebox) with
# their own test suites — without this, a bare `pytest` from the repo root
# recurses into them and can run for many minutes instead of the offline
# suite's fraction of a second.
testpaths = ["tests"]
