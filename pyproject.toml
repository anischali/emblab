[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emblab"
version = "0.1.0"
description = "Declarative build orchestrator for embedded bootloader/firmware stacks"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
emblab = "emblab.cli:main"

[tool.setuptools.packages.find]
include = ["emblab*"]
