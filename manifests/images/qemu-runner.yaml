description: >
  Runs the `qemu-system-*` binaries themselves, containerized (see
  ADR-012). Shared by every target's `qemu:` block. No cross-toolchain
  here — this image never builds anything, it only runs the emulator
  against artifacts already built by other components' images.
base_image: docker.io/library/debian:bookworm-slim
provision:
  # qemu-system-arm/-misc depend on libibverbs1 (RDMA live-migration
  # support, unused here), whose postinst tries to create a system 'rdma'
  # group — real group/user creation fails under udocker's unprivileged
  # execution regardless of mode. No functional loss: nothing here needs
  # that group, so no-op stubs ahead of dpkg's postinst are enough.
  - >-
    for n in groupadd useradd addgroup adduser; do
    printf '#!/bin/sh\nexit 0\n' > /usr/sbin/$n; chmod +x /usr/sbin/$n; done
  - apt-get update
  # ipxe-qemu and seabios are only Recommends of qemu-system-arm/-misc, so
  # --no-install-recommends drops them — but without ipxe-qemu, any
  # virtio-pci device makes QEMU refuse to start ("failed to find romfile
  # 'efi-virtio.rom'"); without seabios, `-device ramfb` (UEFI's GOP
  # framebuffer) fails the same way over vgabios-ramfb.bin. Listed
  # explicitly rather than dropping --no-install-recommends wholesale.
  - >-
    apt-get install -y --no-install-recommends
    qemu-system-arm qemu-system-misc qemu-system-x86 ipxe-qemu seabios bash-completion
env: {}
