name: coreboot-sdk
description: >
  coreboot's own official prebuilt cross-toolchain image
  (docker.io/coreboot/coreboot-sdk), used instead of building crossgcc
  from source (see coreboot.yaml). /opt/xgcc/bin/aarch64-elf-gcc is GCC
  14.2.0 with a full binutils set plus iasl/nasm, satisfying the GCC 14+
  (-std=gnu23) requirement coreboot's main needs — this project's own
  gnu-aarch64 image only ships Debian bookworm's stock GCC 12.2.0.
base_image: docker.io/coreboot/coreboot-sdk:latest
provision:
  # debian.sources ships an unpinned `Suites: stable` alias; Debian's
  # "stable" has since moved to trixie, which apt refuses to fetch without
  # explicit opt-in. Pin to bookworm explicitly rather than accept the
  # trixie switch (a real libc/ABI mismatch risk against this bookworm
  # rootfs).
  - >-
    sed -i
    's/^Suites: stable stable-updates$/Suites: bookworm bookworm-updates/;
    s/^Suites: stable-security$/Suites: bookworm-security/'
    /etc/apt/sources.list.d/debian.sources
  - apt-get update
  # libncurses-dev: `make menuconfig` (coreboot uses Kconfig too) needs it.
  - apt-get install -y --no-install-recommends libncurses-dev python3-libfdt
env: {}
