name: gnu-aarch64
description: >
  aarch64 + arm32 GNU cross toolchain, plus OP-TEE/TF-A/meson build
  dependencies. Provisioned via udocker pull+create+run (see ADR-004 —
  never via udocker's Dockerfile-subset builder).
base_image: docker.io/library/debian:bookworm-slim
provision:
  - apt-get update
  - >-
    apt-get install -y --no-install-recommends
    build-essential git python3 python3-pip python3-pyelftools python3-pycryptodome
    device-tree-compiler bison flex libssl-dev pkg-config bc rsync unzip
    gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi
    meson ninja-build libglib2.0-dev lz4 python3-cryptography
env:
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE32: arm-linux-gnu-
  CROSS_COMPILE64: aarch64-linux-gnu-
