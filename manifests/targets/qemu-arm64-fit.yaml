name: qemu-arm64-fit
description: >
  linux-kernel (Image) + uroot-ramdisk (initramfs.cpio) are both built,
  then packaged together by fit-image (mkimage) — an "N build outputs -> 1
  packaged output" pattern via ${component.artifact} tokens in a target's
  stack vars (ADR-005). QEMU boots the kernel+initrd directly via
  -kernel/-initrd, not through the packaged FIT image.
arch: arm64
stack:
  - component: linux-kernel
    image: gnu-aarch64
    vars:
      arch: arm64
  - component: uroot-ramdisk
    image: go
    vars:
      goarch: arm64
  - component: fit-image
    image: gnu-aarch64
    # mkimage ships in Debian's u-boot-tools, not gnu-aarch64's base
    # package set — not needed by anything else in this stack (see
    # ADR-009).
    builddeps:
      - u-boot-tools
    vars:
      kernel: ${linux-kernel.image}
      ramdisk: ${uroot-ramdisk.cpio}
qemu:
  binary: qemu-system-aarch64
  image: qemu-runner
  args:
    - "-cpu"
    - "cortex-a57"
    - "-M"
    - "virt"
    - "-m"
    - "1G"
    - "-nographic"
    - "-kernel"
    - "${linux-kernel.image}"
    - "-initrd"
    - "${uroot-ramdisk.cpio}"
    - "-append"
    - "console=ttyAMA0"
