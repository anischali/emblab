name: qemu-arm64-secureboot
description: >
  TF-A BL1/BL2/BL31 + OP-TEE BL32 + barebox BL33, secure=on. QEMU args
  transcribed verbatim from barebox-arm64-poc/generate-fit's known-correct
  (currently commented out) secure-boot invocation. Exercises the full
  schema: a three-component stack, cross-component artifact wiring, and a
  conditionally-populated flag-group var.
arch: arm64
stack:
  - component: optee-os
    image: gnu-aarch64
    vars:
      platform: vexpress-qemu_armv8a
  - component: barebox
    image: gnu-aarch64
    vars:
      defconfig: multi_v8_defconfig
      arch: arm64
  - component: tf-a
    image: gnu-aarch64
    # GENERATE_COT=1 in tf-a's command builds cert_create, which links
    # against GnuTLS for X.509 certificate generation — not in
    # gnu-aarch64's shared package set since no other component in this
    # stack needs it (see ADR-009).
    builddeps:
      - libgnutls28-dev
    vars:
      plat: qemu
      bl32_flags: >-
        BL32=${optee-os.tee-header} BL32_EXTRA1=${optee-os.tee-pager} BL32_EXTRA2=${optee-os.tee-pageable}
      bl33: ${barebox.images}/barebox-dt-2nd.img
qemu:
  binary: qemu-system-aarch64
  image: qemu-runner
  args:
    - "-cpu"
    - "cortex-a57"
    - "-M"
    - "virt,secure=on"
    - "-m"
    - "1G"
    - "-serial"
    - "mon:stdio"
    - "-serial"
    - "file:${env.WORKSPACE}/artifacts/qemu-arm64-secureboot/optee.log"
    - "-device"
    - "virtio-rng-pci"
    - "-device"
    - "ramfb"
    - "-semihosting-config"
    - "enable=on,target=native"
    - "-device"
    - "sdhci-pci,id=sdhci0"
    - "-bios"
    - "${tf-a.qemu_fw}"
