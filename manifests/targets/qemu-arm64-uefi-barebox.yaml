name: qemu-arm64-uefi-barebox
description: >
  Plain UEFI + barebox, no TF-A/OP-TEE. QEMU args transcribed verbatim from
  barebox-arm64-poc/generate-fit's currently-active (uncommented) boot
  invocation.
arch: arm64
stack:
  - component: barebox
    image: gnu-aarch64
    vars:
      defconfig: efi_v8_defconfig
      arch: arm64
qemu:
  binary: qemu-system-aarch64
  image: qemu-runner
  args:
    - "-cpu"
    - "cortex-a57"
    - "-M"
    - "virt,acpi=off"
    - "-m"
    - "1G"
    - "-serial"
    - "mon:stdio"
    - "-device"
    - "virtio-rng-pci"
    - "-device"
    - "ramfb"
    - "-bios"
    - "/usr/share/edk2/aarch64/QEMU_EFI.silent.fd"
    - "-kernel"
    - "${barebox.images}/barebox-dt-2nd.img"