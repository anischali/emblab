name: qemu-arm64-edk2-barebox
description: >
  Same boot flow as qemu-arm64-uefi-barebox, except -bios is emblab's own
  freshly-built edk2 (ArmVirtQemu QEMU_EFI.fd) instead of a host package.
  barebox is NOT bundled inside the firmware volume — QEMU loads edk2 as
  -bios and barebox as -kernel, two separate things (see
  qemu-arm64-edk2-fvbootdxe-barebox for the bundled variant).
arch: arm64
stack:
  - component: edk2
    image: gnu-aarch64
    # iasl (ACPI table compiler) and uuid-dev are edk2-specific, and cmake
    # builds CryptoPkg's vendored crypto submodules — not in gnu-aarch64's
    # shared package set since no other component sharing that image needs
    # them (see ADR-009).
    builddeps:
      - iasl
      - uuid-dev
      - cmake
    vars:
      edk2_arch: AARCH64
      # EDK2's own Build output directory uses a differently-cased
      # "friendly" arch name than the -a flag/env var spelling above; the
      # leading "-" is part of this var, not edk2.yaml's artifacts.fd
      # template (see edk2.yaml).
      edk2_build_arch: "-AArch64"
  - component: barebox
    image: gnu-aarch64
    vars:
      defconfig: efi_v8_defconfig
      arch: arm64
qemu:
  binary: qemu-system-aarch64
  image: qemu-runner
  args:
    - "-cpu"
    - "cortex-a57"
    - "-M"
    - "virt,acpi=off"
    - "-m"
    - "1G"
    - "-serial"
    - "mon:stdio"
    - "-device"
    - "virtio-rng-pci"
    - "-device"
    - "ramfb"
    - "-bios"
    - "${edk2.fd}"
    - "-kernel"
    - "${barebox.images}/barebox-dt-2nd.img"
