name: qemu-arm64-coreboot-barebox
description: >
  ARCHITECTURE CHANGED, NOT YET BOOTING — this target previously bundled
  barebox's own FIT output directly as coreboot's CBFS payload and was
  confirmed booting for real (see CONTEXT.md's Proven history for that
  full story — four earlier payload-format attempts, the last of which
  worked end to end). Per explicit direction, it now instead follows the
  "real UEFI firmware between coreboot and the final payload" shape:
  coreboot's CBFS payload is a real AArch64 build of edk2's
  UefiPayloadPkg (this project's own edk2 component, ${edk2.fd} below —
  NOT coreboot's own payloads/external/edk2/Makefile, confirmed for real
  to hardcode -a IA32/-D BUILD_ARCH=X64 with no AARCH64 codepath at all
  despite Kconfig.name nominally allowing selection on ARCH_ARM64), which
  is then meant to boot barebox as a completely normal UEFI application —
  barebox is now built with CONFIG_EFI_PAYLOAD_ESP_IMAGE (esp.cfg, see
  barebox.yaml) into a real bootable GPT/FAT disk image
  (images/barebox.esp) with barebox.efi at the standard removable-media
  path EFI/BOOT/BOOTAA64.EFI, attached to QEMU as a virtio-blk drive
  below — UefiPayloadPkg.dsc's own AARCH64 component list already
  includes VirtioBlkDxe/PartitionDxe/FatPkg/BdsDxe, confirmed by reading
  the dsc, so no custom driver/patch is needed for it to find and boot
  that image the standard way.

  Two real, confirmed-and-fixed bugs getting UefiPayloadPkg this far: (1)
  UefiPayloadPkg.fdf's own DEFINE FD_BASE = 0x00800000 default (also
  UefiPayloadPkgTokenSpaceGuid.PcdPayloadFdMemBase) is an x86 assumption
  — confirmed for real to fail on this board with cbfstool own SELF
  loader refusing the payload ("SELF segment doesn't target RAM:
  0x00800000"), since real RAM here only starts at 0x40000000; fixed by
  overriding it to 0x48000000 via the edk2 stack entry's build_macros
  below. (2) payloads/Kconfig own payload-compression choice defaults to
  COMPRESSED_PAYLOAD_NONE only when PAYLOAD_FIT_SUPPORT is selected
  (which barebox own former CONFIG_PAYLOAD_FIT payload got automatically
  but CONFIG_PAYLOAD_ELF below does not) — confirmed by reading
  payloads/Kconfig directly; fixed by explicitly setting
  CONFIG_COMPRESSED_PAYLOAD_NONE=y. Neither fix resolved the actual
  remaining blocker, see below.

  CONFIG_PAYLOAD_ELF (not CONFIG_PAYLOAD_EDK2/CONFIG_EDK2_UEFIPAYLOAD, for
  the AARCH64-Makefile reason above) works here despite its name: reading
  util/cbfstool/cbfstool.c confirms add-payload's cbfstool_convert_mkpayload
  tries ELF, then FIT, then a raw UEFI firmware volume
  (parse_fv_to_payload) before giving up, and the real
  UEFIPAYLOAD.fd built here is a raw FV (confirmed via od: FVH signature
  at file offset 0x28, no ELF magic at all) — so it is picked up by the
  same generic cbfs "payload" type barebox own former FIT payload used,
  via the FV fallback path specifically.

  **STILL NOT BOOTING, real and unresolved**: `emblab build` succeeds and
  a real boot log confirms the payload segment loads correctly
  (uncompressed, dstaddr 0x48000000 matching FD_BASE, entry point
  0x4800321c) and BL31 hands off cleanly (coreboot own bl31.c always
  enters any payload at EL2, unconditionally, confirmed by reading
  src/arch/arm64/boot.c — the same path barebox own FIT payload already
  booted through successfully, so EL2 entry itself is not the problem) —
  but there is zero further console output at all past that handoff, and
  a QEMU boot up to 60s produces nothing more (still running, not
  crashed/exited — confirmed via timeout). x0 on entry is
  0x7ffdc000, matching where coreboot own log says it wrote its handoff
  table, and UefiPayloadPkg.dsc resolves BlParseLib to
  UefiPayloadPkg/Library/CbParseLib for BOOTLOADER=COREBOOT, so the
  handoff convention itself looks architecturally correct by inspection —
  the actual cause has not been isolated yet (needs either a QEMU
  gdbstub-attached session to see real register/PC state, or an early raw
  MMIO UART poke patched directly into UefiPayloadEntry.c to bisect how
  far real execution gets before whatever is silencing it).
arch: arm64
stack:
  - component: barebox
    image: gnu-aarch64
    # python3-libfdt: scripts/make_fit.py (`import libfdt`) needs it to
    # build images/barebox-arm64.fit — gnu-aarch64's baseline provisioning
    # has python3 but not this binding, confirmed by grepping its own
    # provision: apt-get list.
    builddeps:
      - python3-libfdt
      - dosfstools
      - mtools
      - fdisk
    vars:
      defconfig: efi_v8_defconfig
      arch: arm64
      # Merges in esp.cfg (see barebox.yaml's build.files) to turn on
      # CONFIG_EFI_PAYLOAD_ESP_IMAGE, which is off by default — a plain
      # bool, not part of a choice group, so a direct merge_config.sh
      # merge (what extra_conf triggers) resolves it correctly with no
      # visibility pitfall like coreboot's payload choice below.
      extra_conf: esp.cfg
  - component: edk2
    image: gnu-aarch64
    vars:
      platform: UefiPayloadPkg
      platform_path: UefiPayloadPkg
      edk2_arch: AARCH64
      # UefiPayloadPkg.dsc's OUTPUT_DIRECTORY = Build/UefiPayloadPkg$(BUILD_ARCH)
      # uses BUILD_ARCH verbatim (confirmed by reading the dsc) — unlike
      # ArmVirtQemu's differently-cased "AArch64" friendly name, this is
      # the same string as -a/edk2_arch above.
      edk2_build_arch: AARCH64
      # FD_BASE overrides UefiPayloadPkg.fdf's own DEFINE FD_BASE = 0x00800000
      # default (also feeds gUefiPayloadPkgTokenSpaceGuid.PcdPayloadFdMemBase
      # via the fdf FD.UefiPayload section BaseAddress = $(FD_BASE) | Pcd...
      # syntax) -- 0x00800000 is an x86 assumption (low physical RAM is
      # usable there on x86), confirmed for real to fail on this board:
      # coreboot own boot log showed real RAM only from 0x40000000, and
      # cbfstool own SELF loader refused the payload with SELF segment
      # does not target RAM: 0x00800000. 0x48000000 sits well inside the
      # free 0x40000000-0x6001ffff RAM range coreboot own table dumped in
      # that same boot log, comfortably clear of ramstage own memory use
      # above it.
      build_macros: "-D BUILD_ARCH=AARCH64 -D BOOTLOADER=COREBOOT -D FD_BASE=0x48000000"
      # UefiPayloadPkg.fdf's [FD.UefiPayload] section — EDK2's build tool
      # uppercases the section name for the real output filename
      # (confirmed against a real build: Build/UefiPayloadPkgAARCH64/
      # DEBUG_GCC/FV/UEFIPAYLOAD.fd), matching coreboot's own
      # payloads/external/edk2/Makefile naming convention even though that
      # Makefile itself is NOT used here (it's hardcoded x86-only, see
      # this target's description).
      fd_name: UEFIPAYLOAD.fd
  - component: coreboot
    # coreboot-sdk ships a prebuilt cross-toolchain (GCC 14.2.0, confirmed
    # real — see coreboot.yaml's Toolchain paragraph) instead of gnu-aarch64's
    # stock GCC 12.2.0, which can't build coreboot's -std=gnu23 main at all.
    # No builddeps needed here any more: no from-source crossgcc build means
    # no texinfo/libgmp-dev/.../gnat-12/ccache — confirmed by a real,
    # complete build with none declared.
    image: coreboot-sdk
    vars:
      payload_conf: |
        # No apostrophes/backticks in this comment on purpose: it lands
        # inside build.command printf %s single quotes, see coreboot.yaml.
        # NOT using CONFIG_PAYLOAD_EDK2/CONFIG_EDK2_UEFIPAYLOAD: confirmed
        # for real that coreboot own payloads/external/edk2/Makefile
        # hardcodes -a IA32 -a X64 / -D BUILD_ARCH=X64 (and -a IA32 for
        # UniversalPayload) with no AARCH64 codepath at all, despite
        # Kconfig.name depends on ARCH_X86 or ARCH_ARM64 nominally allowing
        # selection here -- that Makefile would build an x86 image
        # regardless of this being an arm64 board. Building UefiPayloadPkg
        # for AARCH64 ourselves instead, via this project own edk2
        # component (see this target edk2 stack entry above), feeding the
        # result in as CONFIG_PAYLOAD_ELF -- confirmed for real by reading
        # util/cbfstool/cbfstool.c that add-payload (payload type in
        # Makefile.mk) tries ELF, then FIT, then a raw UEFI firmware
        # volume (parse_fv_to_payload) before giving up, and our own
        # UEFIPAYLOAD.fd is a raw FV (confirmed via od: FVH signature at
        # offset 0x28, no ELF magic) -- so CONFIG_PAYLOAD_ELF works here
        # despite the misleading Kconfig name, same generic payload cbfs
        # type barebox own CONFIG_PAYLOAD_FIT above already uses.
        CONFIG_VENDOR_EMULATION=y
        CONFIG_BOARD_EMULATION_QEMU_AARCH64=y
        # CONFIG_PAYLOAD_NONE is not set
        CONFIG_PAYLOAD_ELF=y
        CONFIG_PAYLOAD_FILE="${edk2.fd}"
        # payloads/Kconfig own compression choice defaults to
        # COMPRESSED_PAYLOAD_NONE only if PAYLOAD_FIT_SUPPORT is selected
        # (which barebox own CONFIG_PAYLOAD_FIT=y above gets via its own
        # select) -- CONFIG_PAYLOAD_ELF=y does not select that, so it falls
        # through to the unconditional default COMPRESSED_PAYLOAD_LZMA,
        # confirmed by reading payloads/Kconfig directly. Real symptom this
        # produced: the 7 MiB raw firmware volume segment loaded and jumped
        # to its entry point with zero further output at all -- consistent
        # with a corrupted LZMA round-trip on a large binary blob, not a
        # load-address or entry-convention problem (both already confirmed
        # correct: dstaddr matches FD_BASE, coreboot own bl31.c hands off
        # to EL2 unconditionally for every payload type, same path already
        # proven working for bareboxs own FIT payload above). Disabling
        # compression for this payload specifically.
        CONFIG_COMPRESSED_PAYLOAD_NONE=y

qemu:
  binary: qemu-system-aarch64
  image: qemu-runner
  args:
    - "-cpu"
    - "cortex-a57"
    - "-M"
    - "virt,acpi=off,secure=on,virtualization=on"
    - "-m"
    - "1G"
    - "-nographic"
    - "-device"
    - "virtio-rng-pci"
    - "-drive"
    - "if=none,format=raw,id=esp,file=${barebox.images}/barebox.esp"
    - "-device"
    - "virtio-blk-pci,drive=esp"
    - "-bios"
    - "${coreboot.rom}"
