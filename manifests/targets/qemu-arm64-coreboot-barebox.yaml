name: qemu-arm64-coreboot-barebox
description: >
  coreboot (src/mainboard/emulation/qemu-aarch64) with barebox bundled as
  its payload — coreboot's Kconfig CONFIG_PAYLOAD_FILE points straight at
  barebox's own build output, embedded into CBFS at coreboot build time.
  QEMU only needs -bios: there's no "-kernel", unlike
  qemu-arm64-edk2-barebox — coreboot never consumes QEMU's -kernel fw_cfg
  loader, so bundling is this target's only boot path (see coreboot.yaml's
  description). barebox uses multi_v8_defconfig, not the efi_v8_defconfig
  the edk2 targets use — that build is a PE32 EFI application meant to run
  under a UEFI environment, and coreboot provides none; multi_v8_defconfig
  sets CONFIG_ARCH_ARM64_VIRT=y (confirmed against a real clone, which
  selects BOARD_ARM_VIRT -> BOARD_GENERIC_DT), producing the same plain
  native barebox-dt-2nd.img every other arm64 target already uses via
  ${barebox.images} — that's what coreboot's generic PAYLOAD_ELF expects.

  UNVERIFIED end-to-end — see coreboot.yaml's description and CONTEXT.md's
  Next section: this needs a real `emblab build
  qemu-arm64-coreboot-barebox` (and then `emblab run`) to confirm that
  CONFIG_PAYLOAD_ELF actually accepts barebox's multi_v8_defconfig output
  as-is.
arch: arm64
stack:
  - component: barebox
    image: gnu-aarch64
    vars:
      defconfig: multi_v8_defconfig
      arch: arm64
  - component: coreboot
    image: gnu-aarch64
    # Packages for coreboot's own crossgcc build (util/crossgcc's buildgcc
    # script compiles GCC 15.2.0/binutils from source — see coreboot.yaml's
    # description for why the image's own gcc/aarch64-linux-gnu-gcc 12.2.0
    # can't be used instead) — not in gnu-aarch64's shared package set
    # since no other component sharing that image builds its own
    # toolchain from scratch.
    builddeps:
      - texinfo
      - libgmp-dev
      - libmpfr-dev
      - libmpc-dev
      - zlib1g-dev
      - wget
      - curl
      - xz-utils
      # Enables buildgcc's own -y/--ccache flag (see coreboot.yaml's setup
      # comment) — caches compiled objects in the container's persistent
      # $HOME/.ccache so a from-scratch crossgcc rebuild is much faster on
      # a warm cache, without changing what actually gets built.
      - ccache
      # crossgcc's buildgcc bootstraps the new GCC's Ada (GNAT) frontend
      # from a host GNAT — without one it just skips Ada support (a rebuild
      # from scratch every time it can't find one, plus no native graphics
      # init for the Intel boards this project doesn't target anyway), and
      # rebuilds/recompiles that check on every crossgcc run. gnat-12 is the
      # bookworm package matching gnu-aarch64's system gcc-12.2.0 (`gcc`
      # from build-essential) — buildgcc requires the host GNAT to match the
      # host gcc it bootstraps against, not the GCC 15.2.0 being built.
      - gnat-12
    vars:
      payload_conf: |
        CONFIG_PAYLOAD_ELF=y
        CONFIG_PAYLOAD_FILE="${barebox.images}/barebox-dt-2nd.img"
qemu:
  binary: qemu-system-aarch64
  image: qemu-runner
  args:
    - "-cpu"
    - "cortex-a57"
    - "-M"
    - "virt,acpi=off"
    - "-m"
    - "1G"
    - "-serial"
    - "mon:stdio"
    - "-device"
    - "virtio-rng-pci"
    - "-bios"
    - "${coreboot.rom}"
