name: qemu-arm64-coreboot-efi-barebox
description: >
  Chain-loads barebox via coreboot's own EDK2 Universal Payload
  (CONFIG_PAYLOAD_EDK2 + CONFIG_EDK2_UNIVERSAL_PAYLOAD) instead of bundling
  barebox's FIT output directly (see qemu-arm64-coreboot-barebox for that
  path). coreboot's payloads/external/edk2/Makefile only ever builds the
  Universal Payload for IA32 — see the coreboot component's stack-entry
  patch, which parameterizes that on CONFIG_ARCH_ARM64 (EDK2's own
  UefiPayloadPkg.dsc already supports AARCH64 as a first-class arch).
arch: arm64
stack:
  - component: barebox
    image: gnu-aarch64
    # python3-libfdt: scripts/make_fit.py (`import libfdt`) needs it to
    # build images/barebox-arm64.fit.
    builddeps:
      - python3-libfdt
      - dosfstools
      - mtools
      - fdisk
    vars:
      defconfig: efi_v8_defconfig
      arch: arm64
      extra_conf: |
        CONFIG_CONSOLE_ACTIVATE_ALL=y
        CONFIG_EFI_PAYLOAD_ESP_IMAGE=y

  - component: coreboot
    # coreboot-sdk ships a prebuilt cross-toolchain (see coreboot.yaml) —
    # no builddeps needed here, no from-source crossgcc build.
    image: coreboot-sdk
    vars:
      extra_conf: |
        CONFIG_VENDOR_EMULATION=y
        CONFIG_BOARD_EMULATION_QEMU_AARCH64=y
        # CONFIG_PAYLOAD_NONE is not set
        CONFIG_PAYLOAD_EDK2=y
        CONFIG_EDK2_UNIVERSAL_PAYLOAD=y

qemu:
  binary: qemu-system-aarch64
  image: qemu-runner
  args:
    - "-cpu"
    - "cortex-a57"
    - "-M"
    - "virt,acpi=off,secure=on,virtualization=on"
    - "-m"
    - "1G"
    - "-nographic"
    - "-device"
    - "virtio-rng-pci"
    - "-bios"
    - "${coreboot.rom}"
    - "-drive"
    - "if=none,file=${barebox.images}/barebox.esp,format=raw,readonly=on"