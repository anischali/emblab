name: fit-image
description: >
  Sourceless packaging component: assembles a kernel + ramdisk into a FIT
  image via mkimage. No upstream repo — see ADR-005 for the sourceless-
  component design. mkimage invocation (mkimage -f fit-image.its fitImage)
  and the .its /incbin/() literal filenames (Image, initramfs.cpio.gz) are
  transcribed from barebox-arm64-poc/generate-fit's generate_fit() and its
  real fit-image.its. UNSIGNED for now: the real project's command adds
  `-F -r -k keys` to sign, which needs a signing-key component emblab
  doesn't have yet (see CONTEXT.md).
build:
  files:
    - fit-image.its
  vars:
    # A target sets these to ${<kernel-component>.<artifact>} and
    # ${<ramdisk-component>.<artifact>}.
    kernel: ""
    ramdisk: ""
  command: >-
    set -e;
    cp ${vars.kernel} Image;
    cp ${vars.ramdisk} initramfs.cpio;
    gzip -kf initramfs.cpio;
    mkimage -f fit-image.its fitImage
artifacts:
  fitImage: fitImage
