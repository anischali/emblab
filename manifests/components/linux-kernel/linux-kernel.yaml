name: linux-kernel
description: >
  Standard defconfig + Kconfig-fragment-merge pattern
  (scripts/kconfig/merge_config.sh, shipped in every mainline kernel tree).
source:
  git: https://github.com/torvalds/linux.git
  ref: master
  path: linux
build:
  files:
    - tiny.cfg
  # vars.arch has no default — every target's stack entry must set it
  # (components stay arch-agnostic, ADR-009).
  vars:
    defconfig: defconfig
    # Space-separated build.files entries to merge via merge_config.sh — a
    # target can override this to select a different fragment subset.
    extra_conf_file: tiny.cfg
    # Individual literal Kconfig lines appended straight onto .config, in
    # addition to (or instead of) extra_conf_file — a plain multi-line
    # string (a YAML list also works, same result). No literal `'` in any
    # line (single-quoted printf below). Empty by default.
    extra_conf: ""
  # Split out so `emblab shell --component` can apply just the config step
  # (see build.shell_context()) without running the actual build.
  config_command: >-
    set -e;
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE ${vars.defconfig};
    ./scripts/kconfig/merge_config.sh -m .config ${vars.extra_conf_file};
    printf '%s\n' '${vars.extra_conf}' >> .config;
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE olddefconfig
  command: >-
    set -e;
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE ${vars.defconfig};
    ./scripts/kconfig/merge_config.sh -m .config ${vars.extra_conf_file};
    printf '%s\n' '${vars.extra_conf}' >> .config;
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE olddefconfig;
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE -j${env.JOBS} Image
artifacts:
  # arch/<ARCH>/boot/Image is itself arch-dependent — templated via the
  # same vars.arch a target must set.
  image: arch/${vars.arch}/boot/Image
