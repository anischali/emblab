name: u-boot
description: >
  UNVERIFIED build command — no u-boot invocation was found anywhere in
  barebox-arm64-poc (it's a barebox-based project); this manifest exists
  purely to demonstrate tf-a's bl33_flags override for a real-bootloader
  BL33 provider, see qemu-arm64-secureboot-uboot.yaml. Uses u-boot's
  standard defconfig+make pattern with qemu_arm64_defconfig, the mainline
  upstream defconfig for QEMU's aarch64 virt machine. MUST be validated
  against a real `git clone` before being trusted — see CONTEXT.md's Next
  section, mirroring the path barebox.yaml already went through.
source:
  git: https://github.com/u-boot/u-boot.git
  ref: master
  path: u-boot
build:
  # vars.arch has no default here — arch is a target concern, not a
  # component one (see ADR-009); every target's stack entry for u-boot
  # must set it. Not ${env.ARCH} (which would resolve to "arm64") — u-boot
  # keeps a single arch/arm/ Kbuild tree for both AArch32 and AArch64
  # (CONFIG_ARM64 selected by the defconfig chosen, not by a separate ARCH
  # value), same arch-naming mismatch already hit for OP-TEE (ADR-006);
  # for this QEMU aarch64 target, the value a target must supply is "arm".
  vars:
    defconfig: qemu_arm64_defconfig
  command: >-
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE ${vars.defconfig} &&
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE -j${env.JOBS}
artifacts:
  bin: u-boot.bin
