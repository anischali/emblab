name: u-boot
description: >
  Standard u-boot defconfig+make pattern, qemu_arm64_defconfig.
source:
  git: https://github.com/u-boot/u-boot.git
  ref: master
  path: u-boot
build:
  # vars.arch has no default — every target's stack entry must set it
  # (components stay arch-agnostic, ADR-009). Not ${env.ARCH} (which would
  # resolve to "arm64") — u-boot keeps a single arch/arm/ Kbuild tree for
  # both AArch32 and AArch64 (CONFIG_ARM64 comes from the defconfig
  # chosen, not from ARCH); the value a target must supply is "arm".
  vars:
    defconfig: qemu_arm64_defconfig
    # Same extra_conf/extra_conf_file mechanism as barebox.yaml/
    # coreboot.yaml/linux-kernel.yaml: extra_conf is individual literal
    # Kconfig lines appended straight onto .config; extra_conf_file is one
    # or more fragment files merged via merge_config.sh -m. Both empty by
    # default.
    extra_conf: ""
    extra_conf_file: ""
  # Split out so `emblab shell --component` can apply just the config step
  # (see build.shell_context()) without running the actual build.
  config_command: >-
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE ${vars.defconfig} &&
    if [ -n "${vars.extra_conf_file}" ]; then ./scripts/kconfig/merge_config.sh -m .config ${vars.extra_conf_file}; fi &&
    printf '%s\n' '${vars.extra_conf}' >> .config
  command: >-
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE ${vars.defconfig} &&
    if [ -n "${vars.extra_conf_file}" ]; then ./scripts/kconfig/merge_config.sh -m .config ${vars.extra_conf_file}; fi &&
    printf '%s\n' '${vars.extra_conf}' >> .config &&
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE -j${env.JOBS}
artifacts:
  bin: u-boot.bin
