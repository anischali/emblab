name: uroot-ramdisk
description: >
  u-root initramfs, optionally embedding other components' build artifacts
  via repeatable -files SRC:DST arguments. -skip-ldd is used because
  embedded files here are typically cross-compiled for the target arch —
  the host's ldd shouldn't walk a foreign-arch ELF's dependencies.
source:
  git: https://github.com/u-root/u-root.git
  ref: main
  path: u-root
build:
  vars:
    # Space-separated Go command packages to bundle; empty lets u-root's
    # own default (github.com/u-root/u-root/cmds/core/*) apply.
    commands: ""
    # Space-separated "host-src-path:ramdisk-dst-path" pairs — a target
    # wires this to ${other-component.artifact}:dest/path, one or more,
    # space-separated, to embed other components' build outputs. Example:
    #   embed: "${dt-utils.barebox-state}:bbin/barebox-state"
    embed: ""
    output: initramfs.cpio
  # vars.goarch has no default here — arch is a target concern, not a
  # component one (see ADR-009); every target's stack entry for
  # uroot-ramdisk must set it. Go's arch names don't always match Linux
  # kernel ARCH= names in general, so this stays its own var rather than
  # reusing ${env.ARCH} — see ADR-006.
  command: >-
    set -e;
    FILES_ARGS="";
    for pair in ${vars.embed}; do FILES_ARGS="$FILES_ARGS -files $pair"; done;
    GOARCH=${vars.goarch} GOOS=linux go run u-root.go -o ${vars.output} -skip-ldd $FILES_ARGS ${vars.commands}
artifacts:
  cpio: initramfs.cpio
