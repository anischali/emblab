name: barebox
description: >
  Builds barebox for QEMU AArch64 (efi_v8_defconfig), producing
  barebox-dt-2nd.img among other files under images/. Not arm64-specific
  despite the name — riscv64's CONFIG_SOC_VIRT selects the same
  arch-agnostic BOARD_GENERIC_DT Kconfig option.
source:
  git: https://github.com/barebox/barebox.git
  ref: master
  path: barebox
build:
  # esp.cfg turns on CONFIG_EFI_PAYLOAD_ESP_IMAGE, producing a bootable
  # GPT/FAT disk image (images/barebox.esp) with barebox's EFI stub at the
  # standard UEFI removable-media path — any UEFI firmware boots it with
  # no custom driver. Always copied in via build.files; only merged in
  # when a target's extra_conf_file opts in.
  files:
    - esp.cfg
  # vars.arch has no default — every target's stack entry must set it
  # (components stay arch-agnostic, see ADR-009). ARCH is a var, not a
  # real env var, since some build systems (OP-TEE's) default it
  # internally and a real env var would leak into builds that never asked
  # for it. $CROSS_COMPILE (unbraced) is a real shell env var set by the
  # target's image, not an emblab ${...} token.
  vars:
    defconfig: efi_v8_defconfig
    # Individual literal Kconfig lines appended straight onto .config —
    # a plain multi-line string (a YAML list also works; both are joined
    # the same way by templating.resolve_value). A Kconfig *choice* group
    # needs its other members' disabling "# CONFIG_X is not set" lines
    # spelled out too (see coreboot.yaml for an example). No literal `'`
    # in any line — this is substituted into a single-quoted shell string
    # in build.command. Empty by default.
    extra_conf: ""
    # One or more Kconfig fragment files, merged via merge_config.sh -m —
    # e.g. "${fit-image.files}/keystore.cfg". Empty by default.
    extra_conf_file: ""
  command: >-
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE ${vars.defconfig} &&
    if [ -n "${vars.extra_conf_file}" ]; then ./scripts/kconfig/merge_config.sh -m .config ${vars.extra_conf_file}; fi &&
    printf '%s\n' '${vars.extra_conf}' >> .config &&
    make ARCH=${vars.arch} CROSS_COMPILE=$CROSS_COMPILE -j${env.JOBS}
artifacts:
  # barebox drops several files into images/; which one a target wants is
  # that target's concern (e.g. ${barebox.images}/barebox-dt-2nd.img).
  images: images/
  # The top-level Kbuild output — a genuine ET_DYN ELF, unlike
  # images/barebox-dt-2nd.img (raw machine code, no ELF header). Needed by
  # payload mechanisms that parse their input as ELF.
  elf: barebox
