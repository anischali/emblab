name: coreboot
description: >
  Builds coreboot's src/mainboard/emulation/qemu-aarch64 target. Unlike
  edk2/barebox, coreboot doesn't chain-load via QEMU's -kernel fw_cfg —
  a second-stage bootloader must be bundled into CBFS as coreboot's own
  payload at build time. vars.extra_conf (below) supplies that payload.

  Toolchain: uses coreboot's own prebuilt cross-toolchain image
  (coreboot-sdk, docker.io/coreboot/coreboot-sdk), not gnu-aarch64 and not
  a from-source util/crossgcc build. coreboot's main requires -std=gnu23
  (GCC 14+); gnu-aarch64's Debian bookworm base only ships GCC 12.2.0.
  coreboot-sdk's /opt/xgcc/bin/aarch64-elf-gcc is GCC 14.2.0 and satisfies
  it directly via XGCCPATH, with no from-source crossgcc build needed.

  vars.defconfig points at files/configs/config.emblab_qemu_aarch64, a
  minimal local defconfig (CONFIG_VENDOR_EMULATION + BOARD_EMULATION_
  QEMU_AARCH64 only) rather than an upstream one — upstream's own qemu-
  aarch64 defconfigs pull in extras (zstd compression, PAYLOAD_FIT_SUPPORT)
  that conflict with this component's payload config.

  source.submodules is a list, not `true`: coreboot's .gitmodules carries
  many vendor-specific 3rdparty/ trees unrelated to this board. Only
  3rdparty/arm-trusted-firmware (selected by the mainboard's Kconfig) and
  3rdparty/vboot (an unconditional cbfstool host-tool dependency via
  commonlib/bsd/cbfs_serialized.h, not Kconfig-gated) are needed.
source:
  git: https://github.com/coreboot/coreboot.git
  ref: main
  path: coreboot
  submodules:
    - 3rdparty/arm-trusted-firmware
    - 3rdparty/vboot
build:
  patches:
    # payloads/external/edk2/Makefile (CONFIG_PAYLOAD_EDK2 path): re-clones
    # if a prior interrupted clone left an empty repo, and stops swallowing
    # fetch errors that showed up as a misleading "not a valid git reference".
    - 0001-edk2-payload-self-heal-clone-and-fetch-tags.patch
  files:
    - configs/config.emblab_qemu_aarch64
  vars:
    # ${files} is the absolute path build.files get copied into (this
    # component's own source dir) — spelled out explicitly since this is
    # an external defconfig (this project's own, not upstream coreboot's).
    defconfig: ${files}/configs/config.emblab_qemu_aarch64
    # Individual literal Kconfig lines appended straight onto .config —
    # a plain multi-line string (a YAML list also works; both are joined
    # the same way by templating.resolve_value). A Kconfig *choice* group
    # (e.g. CONFIG_PAYLOAD_*) needs its other members' disabling
    # "# CONFIG_X is not set" lines spelled out too. No literal `'` in any
    # line — this is substituted into a single-quoted shell string in
    # build.command. Empty by default.
    extra_conf: ""
    # One or more Kconfig fragment files, merged via merge_config.sh -m —
    # the right tool for a Kconfig *choice* group instead of hand-writing
    # every other member's disabling line. Empty by default.
    extra_conf_file: ""
  # UPDATED_SUBMODULES=1: coreboot's own Makefile.mk otherwise runs a bare
  # `git submodule update --init` (every .gitmodules entry, ignoring
  # source.submodules above) at parse time, which has been observed to
  # wipe the source tree under udocker.
  #
  # HOSTCC/HOSTCXX=clang: coreboot's host tools (cbfstool, sconfig, ...)
  # build with $(HOSTCC), which defaults to the container's system gcc
  # (too old for -std=gnu23) rather than coreboot-sdk's /opt/xgcc
  # aarch64-elf-gcc; coreboot-sdk's bundled clang-18 handles -std=gnu23
  # for host tools instead.
  #
  # rm -rf build: a Kconfig symbol flipping between builds (e.g. via
  # extra_conf) can leave a stale, already-linked ramstage/*.a that Make
  # treats as up to date and doesn't relink against newly-relevant object
  # files. Forcing a clean build/ avoids that whole class of staleness.
  #
  # Explicit olddefconfig between the printf and the parallel build:
  # coreboot's Makefile otherwise regenerates config.h/auto.conf lazily,
  # mid-build, inside the main -j${JOBS} invocation — objects can get
  # compiled against not-yet-settled config state. Running olddefconfig
  # single-threaded first avoids that race.
  # Split out so `emblab shell --component` can apply just the config step
  # (see build.shell_context()) without running the actual build.
  config_command: >-
    set -e;
    rm -rf build;
    make UPDATED_SUBMODULES=1 XGCCPATH=/opt/xgcc/bin/ HOSTCC=/opt/xgcc/bin/clang HOSTCXX=/opt/xgcc/bin/clang++ GCC_AARCH64_PREFIX=/opt/xgcc/bin/aarch64-elf- KBUILD_DEFCONFIG=${vars.defconfig} defconfig;
    if [ -n "${vars.extra_conf_file}" ]; then ./scripts/kconfig/merge_config.sh -m .config ${vars.extra_conf_file}; fi;
    printf '%s\n' '${vars.extra_conf}' >> .config;
    make UPDATED_SUBMODULES=1 XGCCPATH=/opt/xgcc/bin/ HOSTCC=/opt/xgcc/bin/clang HOSTCXX=/opt/xgcc/bin/clang++ GCC_AARCH64_PREFIX=/opt/xgcc/bin/aarch64-elf- olddefconfig
  command: >-
    set -e;
    rm -rf build;
    make UPDATED_SUBMODULES=1 XGCCPATH=/opt/xgcc/bin/ HOSTCC=/opt/xgcc/bin/clang HOSTCXX=/opt/xgcc/bin/clang++ GCC_AARCH64_PREFIX=/opt/xgcc/bin/aarch64-elf- KBUILD_DEFCONFIG=${vars.defconfig} defconfig;
    if [ -n "${vars.extra_conf_file}" ]; then ./scripts/kconfig/merge_config.sh -m .config ${vars.extra_conf_file}; fi;
    printf '%s\n' '${vars.extra_conf}' >> .config;
    make UPDATED_SUBMODULES=1 XGCCPATH=/opt/xgcc/bin/ HOSTCC=/opt/xgcc/bin/clang HOSTCXX=/opt/xgcc/bin/clang++ GCC_AARCH64_PREFIX=/opt/xgcc/bin/aarch64-elf- olddefconfig;
    make UPDATED_SUBMODULES=1 XGCCPATH=/opt/xgcc/bin/ HOSTCC=/opt/xgcc/bin/clang HOSTCXX=/opt/xgcc/bin/clang++ GCC_AARCH64_PREFIX=/opt/xgcc/bin/aarch64-elf- -j${env.JOBS}
artifacts:
  rom: build/coreboot.rom
