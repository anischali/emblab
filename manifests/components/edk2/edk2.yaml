name: edk2
description: >
  UNVERIFIED build command — transcribed from barebox-arm64-poc/edk/build.run
  (the PACKAGES_PATH/edksetup.sh/BaseTools/build invocation) and
  barebox-arm64-poc/edk/containers/Dockerfile (the package list TianoCore's
  own build container installs). Builds vanilla upstream edk2's ArmVirtQemu
  platform by default. ArmVirtQemu.dsc doesn't reference edk2-platforms/
  edk2-non-osi (those are only in build.run's PACKAGES_PATH for other
  platforms), so this component clones just edk2 itself.

  Bundling a payload (e.g. barebox) into the firmware volume so it boots
  without a separate QEMU -kernel needs a custom BDS driver — real source
  now exists at https://codeberg.org/anischali/FvBootDxe (the barebox-
  arm64-poc/edk EFI_CRASH_COURSE.md section 16 that first described this
  design predates that repo and doesn't implement it itself). Available as
  files/0001-fvbootdxe-bundle-app.patch — a target opts in by naming it in
  its own stack entry's patches: (a target-specific extra, see ADR-010),
  it is NOT in this component's own build.patches and so is not applied by
  default. Also needs vars.fv_boot_app_flag (below) set by that same
  target, to actually reference a built EFI payload.
source:
  git: https://github.com/tianocore/edk2.git
  ref: master
  path: edk2
  # CryptoPkg vendors OpenSSL/mbedTLS as git submodules (CryptoPkg/Library/
  # {OpensslLib/openssl,MbedTlsLib/mbedtls}) — ArmVirtQemu.dsc pulls in
  # CryptoPkg components, so a build without these fails.
  submodules: true
build:
  # vars.edk2_arch and vars.edk2_build_arch have no default here — arch is
  # a target concern, not a component one (see ADR-009); every target's
  # stack entry for edk2 must set both: edk2_arch for EDK2's own BaseTools
  # -a flag / GCC_<ARCH>_PREFIX env var name spelling (e.g. "AARCH64" — not
  # ${env.ARCH}, which would resolve to the differently-spelled "arm64"),
  # and edk2_build_arch for the differently-cased "friendly" arch name
  # EDK2's own Build/<platform>-<arch> output directory uses (e.g.
  # "AArch64" — confirmed against a real build, not documented anywhere
  # obvious in EDK2 itself).
  vars:
    platform: ArmVirtQemu
    platform_path: ArmVirtPkg
    # Empty by default (plain vanilla firmware, no bundled payload) — make
    # needs this flag entirely ABSENT, not present-with-empty-value, same
    # conditionally-populated-var trick as tf-a.yaml's bl32_flags/
    # bl33_flags. A target that wants FvBootDxe bundling (see description
    # above) sets this to "-D FV_BOOT_APP_PATH=<path-to-payload.efi>" —
    # e.g. "-D FV_BOOT_APP_PATH=${barebox.images}/barebox-dt-2nd.img"
    # (barebox's efi_v8_defconfig output *is* a PE32 EFI application
    # despite the .img name — confirmed: barebox.efi is a build-time
    # symlink to the same file).
    fv_boot_app_flag: ""
    # Empty by default — same conditionally-populated-var trick as
    # fv_boot_app_flag above. UefiPayloadPkg.dsc needs extra -D macros
    # ArmVirtQemu.dsc doesn't (BUILD_ARCH, to pick its per-arch Build/
    # output dir — UefiPayloadPkg.dsc's own DEFINE, unrelated to
    # edk2_build_arch below which is this project's var for the same
    # concept on the ArmVirtQemu side; BOOTLOADER=COREBOOT, to compile in
    # coreboot glue code gated by `!if $(BOOTLOADER) == "COREBOOT"` in the
    # dsc — confirmed by reading UefiPayloadPkg.dsc directly, default is
    # "SBL" otherwise). A target building UefiPayloadPkg sets this to
    # "-D BUILD_ARCH=AARCH64 -D BOOTLOADER=COREBOOT".
    build_macros: ""
    # QEMU_EFI.fd is ArmVirtQemu.dsc's own FDF output name (its [FD.QEMU_EFI]
    # section, confirmed for real by every already-proven edk2 target using
    # this component). A target building a different platform DSC (e.g.
    # UefiPayloadPkg, whose own FDF names its output differently — see
    # UefiPayloadPkg.fdf's [FD.UefiPayload] section) overrides this.
    fd_name: QEMU_EFI.fd
  command: >-
    set -e;
    export PACKAGES_PATH=$PWD;
    export GCC_${vars.edk2_arch}_PREFIX=$CROSS_COMPILE;
    pip3 install --break-system-packages -r pip-requirements.txt;
    . ./edksetup.sh;
    make -C BaseTools;
    build -a ${vars.edk2_arch} -t GCC -b DEBUG -p ${vars.platform_path}/${vars.platform}.dsc ${vars.fv_boot_app_flag} ${vars.build_macros}
artifacts:
  # ${vars.edk2_build_arch}, not ${vars.edk2_arch} — EDK2's Build output
  # directory uses its own differently-cased "friendly" arch name (e.g.
  # "AArch64"), not the uppercase spelling the -a flag/env var need. No
  # hyphen in this template on purpose — ArmVirtQemu.dsc doesn't set
  # OUTPUT_DIRECTORY at all (EDK2's own default output-dir pattern is
  # "<PLATFORM_NAME>-<arch>", confirmed for real: "ArmVirtQemu-AArch64",
  # so its own edk2_build_arch carries the leading "-" itself), while
  # UefiPayloadPkg.dsc DOES set its own explicit
  # `OUTPUT_DIRECTORY = Build/UefiPayloadPkg$(BUILD_ARCH)` (confirmed by
  # reading the dsc) with no hyphen at all — putting the hyphen in
  # edk2_build_arch instead of here lets one template serve both.
  fd: Build/${vars.platform}${vars.edk2_build_arch}/DEBUG_GCC/FV/${vars.fd_name}
