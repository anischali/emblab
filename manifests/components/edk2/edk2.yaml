name: edk2
description: >
  UNVERIFIED build command — transcribed from barebox-arm64-poc/edk/build.run
  (the PACKAGES_PATH/edksetup.sh/BaseTools/build invocation) and
  barebox-arm64-poc/edk/containers/Dockerfile (the package list TianoCore's
  own build container installs). Builds vanilla upstream edk2's ArmVirtQemu
  platform by default. ArmVirtQemu.dsc doesn't reference edk2-platforms/
  edk2-non-osi (those are only in build.run's PACKAGES_PATH for other
  platforms), so this component clones just edk2 itself.

  Bundling a payload (e.g. barebox) into the firmware volume so it boots
  without a separate QEMU -kernel needs a custom BDS driver — real source
  now exists at https://codeberg.org/anischali/FvBootDxe (the barebox-
  arm64-poc/edk EFI_CRASH_COURSE.md section 16 that first described this
  design predates that repo and doesn't implement it itself). Available as
  files/0001-fvbootdxe-bundle-app.patch — a target opts in by naming it in
  its own stack entry's patches: (a target-specific extra, see ADR-010),
  it is NOT in this component's own build.patches and so is not applied by
  default. Also needs vars.fv_boot_app_flag (below) set by that same
  target, to actually reference a built EFI payload.
source:
  git: https://github.com/tianocore/edk2.git
  ref: master
  path: edk2
  # CryptoPkg vendors OpenSSL/mbedTLS as git submodules (CryptoPkg/Library/
  # {OpensslLib/openssl,MbedTlsLib/mbedtls}) — ArmVirtQemu.dsc pulls in
  # CryptoPkg components, so a build without these fails.
  submodules: true
build:
  # vars.edk2_arch has no default here — arch is a target concern, not a
  # component one (see ADR-009); every target's stack entry for edk2 must
  # set it (EDK2's own BaseTools -a flag / GCC5_<ARCH>_PREFIX env var name
  # spelling, e.g. "AARCH64" — not ${env.ARCH}, which would resolve to the
  # differently-spelled "arm64").
  vars:
    platform: ArmVirtQemu
    platform_path: ArmVirtPkg
    # Empty by default (plain vanilla firmware, no bundled payload) — make
    # needs this flag entirely ABSENT, not present-with-empty-value, same
    # conditionally-populated-var trick as tf-a.yaml's bl32_flags/
    # bl33_flags. A target that wants FvBootDxe bundling (see description
    # above) sets this to "-D FV_BOOT_APP_PATH=<path-to-payload.efi>" —
    # e.g. "-D FV_BOOT_APP_PATH=${barebox.images}/barebox-dt-2nd.img"
    # (barebox's efi_v8_defconfig output *is* a PE32 EFI application
    # despite the .img name — confirmed: barebox.efi is a build-time
    # symlink to the same file).
    fv_boot_app_flag: ""
  command: >-
    set -e;
    export PACKAGES_PATH=$PWD;
    export GCC5_${vars.edk2_arch}_PREFIX=$CROSS_COMPILE;
    pip3 install --break-system-packages -r pip-requirements.txt;
    . ./edksetup.sh;
    make -C BaseTools;
    build -a ${vars.edk2_arch} -t GCC5 -b DEBUG -p ${vars.platform_path}/${vars.platform}.dsc ${vars.fv_boot_app_flag}
artifacts:
  fd: Build/${vars.platform}-${vars.edk2_arch}/DEBUG_GCC5/FV/QEMU_EFI.fd
