name: edk2
description: >
  Builds upstream edk2's ArmVirtQemu platform by default.

  Bundling a payload (e.g. barebox) into the firmware volume so it boots
  without a separate QEMU -kernel needs a custom BDS driver
  (https://codeberg.org/anischali/FvBootDxe), available as
  files/0001-fvbootdxe-bundle-app.patch. Not applied by default — a target
  opts in via its own stack entry's patches: (ADR-010), plus setting
  vars.fv_boot_app_flag (below) to reference a built EFI payload.
source:
  git: https://github.com/tianocore/edk2.git
  ref: master
  path: edk2
  # CryptoPkg vendors OpenSSL/mbedTLS as submodules; ArmVirtQemu.dsc pulls
  # in CryptoPkg, so a build without these fails.
  submodules: true
build:
  # vars.edk2_arch/edk2_build_arch have no default — every target's stack
  # entry must set both (components stay arch-agnostic, ADR-009):
  # edk2_arch is BaseTools' -a flag / GCC_<ARCH>_PREFIX spelling (e.g.
  # "AARCH64"); edk2_build_arch is EDK2's differently-cased Build output
  # dir name (e.g. "AArch64").
  vars:
    platform: ArmVirtQemu
    platform_path: ArmVirtPkg
    # Empty by default — must be entirely ABSENT, not present-with-empty-
    # value, same conditionally-populated-var trick as tf-a.yaml's
    # bl32_flags/bl33_flags. A target wanting FvBootDxe bundling sets this
    # to "-D FV_BOOT_APP_PATH=<path-to-payload.efi>" (barebox's
    # efi_v8_defconfig output is itself a PE32 EFI application despite the
    # .img name).
    fv_boot_app_flag: ""
    # Empty by default, same trick as fv_boot_app_flag. UefiPayloadPkg.dsc
    # needs extra -D macros ArmVirtQemu.dsc doesn't: BUILD_ARCH (its own
    # per-arch Build output dir selector) and BOOTLOADER=COREBOOT (compiles
    # in coreboot glue, default is "SBL" otherwise). A target building
    # UefiPayloadPkg sets "-D BUILD_ARCH=AARCH64 -D BOOTLOADER=COREBOOT".
    build_macros: ""
    # ArmVirtQemu.dsc's own FDF output name ([FD.QEMU_EFI]). A target
    # building a different platform DSC overrides this to match its own
    # FDF's FD section name.
    fd_name: QEMU_EFI.fd
  command: >-
    set -e;
    export PACKAGES_PATH=$PWD;
    export GCC_${vars.edk2_arch}_PREFIX=$CROSS_COMPILE;
    pip3 install --break-system-packages -r pip-requirements.txt;
    . ./edksetup.sh;
    make -C BaseTools;
    build -a ${vars.edk2_arch} -t GCC -b DEBUG -p ${vars.platform_path}/${vars.platform}.dsc ${vars.fv_boot_app_flag} ${vars.build_macros}
artifacts:
  # edk2_build_arch (not edk2_arch) carries EDK2's own "friendly" arch
  # spelling and its own leading "-" where needed — ArmVirtQemu.dsc's
  # default output dir is "<PLATFORM_NAME>-<arch>" (e.g.
  # "ArmVirtQemu-AArch64"), while UefiPayloadPkg.dsc sets an explicit
  # `OUTPUT_DIRECTORY = Build/UefiPayloadPkg$(BUILD_ARCH)` with no hyphen —
  # putting the hyphen in edk2_build_arch itself lets one template serve
  # both.
  fd: Build/${vars.platform}${vars.edk2_build_arch}/DEBUG_GCC/FV/${vars.fd_name}
