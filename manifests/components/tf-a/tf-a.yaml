name: tf-a
description: >
  Trusted Firmware-A, PLAT=qemu. BL32/BL33 are left as vars so a target can
  wire in OP-TEE and any BL33 provider (barebox/u-boot/edk2) — this is a
  pure component, it never references another component itself; only a
  target's stack vars may do that.
source:
  git: https://git.trustedfirmware.org/TF-A/trusted-firmware-a.git
  ref: master
  path: trusted-firmware-a
build:
  vars:
    plat: qemu
    # Empty by default (no secure payload). A target that wants OP-TEE as
    # BL32 sets this to the fully-formed "BL32=... BL32_EXTRA1=... BL32_EXTRA2=..."
    # string — make needs these flags entirely ABSENT for "no secure OS",
    # not present-with-empty-value.
    bl32_flags: ""
    # ARM_LINUX_KERNEL_AS_BL33=1 by default: loads BL33 as a raw
    # kernel/EFI payload rather than a real bootloader image (correct for
    # barebox's EFI-mode build). A real bootloader BL33 (u-boot, say) is
    # its own BL33 and needs this flag entirely ABSENT, not set to 0 — a
    # target overrides bl33_flags to "" for that case.
    bl33_flags: "ARM_LINUX_KERNEL_AS_BL33=1"
    bl33: ""
    # "fip" requires BL33 non-empty (TF-A's own qemu platform.mk fails the
    # build otherwise: "Platform 'qemu' requires BL33"). A target that
    # only wants a standalone bl31.elf — e.g. coreboot's own
    # CONFIG_ARM64_BL31_EXTERNAL_FILE, which hands off back to coreboot
    # itself rather than a BL33 TF-A packs into a fip — overrides this to
    # "all", dropping fip (and its BL33 requirement) entirely. When it
    # does, it must also blank fip_path/qemu_fw_path below (fip.bin and
    # qemu_fw.bios are fip byproducts, never produced without it) — an
    # artifact path that resolves to "" is skipped by the driver instead
    # of failing as a missing file after the build (same convention as
    # bl32_flags/bl33 above).
    make_targets: "all fip"
    fip_path: build/qemu/debug/fip.bin
    qemu_fw_path: build/qemu/debug/qemu_fw.bios
  # YAML folded scalar (>-) joins same-indentation lines with a bare space,
  # not a shell separator — every statement below ends in an explicit ";"
  # so the fold can't merge two statements into one invalid command (a
  # bare-space join here silently ran `local` outside a function, and
  # separately made `[ -n ... ]`'s test part of the *previous* command's
  # word list instead of its own command, so the BL32/BL33 flags were
  # silently dropped instead of erroring loudly).
  command: >-
    extra_args="";
    [ -n "${vars.bl32_flags}" ] && extra_args="$extra_args ${vars.bl32_flags}";
    [ -n "${vars.bl33_flags}" ] && extra_args="$extra_args ${vars.bl33_flags}";
    [ -n "${vars.bl33}" ] && extra_args="$extra_args BL33=${vars.bl33}";
    make -j${env.JOBS} CROSS_COMPILE=$CROSS_COMPILE PLAT=${vars.plat} DEBUG=1 -B
    RESET_TO_BL31=1 LOG_LEVEL=30 BL32_RAM_LOCATION=tdram SPD=opteed GENERATE_COT=1
    ${vars.make_targets} $extra_args
artifacts:
  bl1: build/qemu/debug/bl1.bin
  fip: ${vars.fip_path}
  elf: build/qemu/debug/bl31/bl31.elf
  qemu_fw: ${vars.qemu_fw_path}
