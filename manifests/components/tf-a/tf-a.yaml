name: tf-a
description: >
  Trusted Firmware-A, PLAT=qemu. BL32/BL33 are left as vars so a target can
  wire in OP-TEE and any BL33 provider (barebox/u-boot/edk2) — this is a
  pure component, it never references another component itself; only a
  target's stack vars may do that. Build flags transcribed verbatim from
  barebox-arm64-poc/build.sh. Ref pinned to 'master' for now — pin an exact
  tag once validated end-to-end (see CONTEXT.md).
source:
  git: https://git.trustedfirmware.org/TF-A/trusted-firmware-a.git
  ref: master
  path: trusted-firmware-a
image: gnu-aarch64
build:
  vars:
    plat: qemu
    # Empty by default (no secure payload). A target that wants OP-TEE as
    # BL32 sets this to the fully-formed "BL32=... BL32_EXTRA1=... BL32_EXTRA2=..."
    # string — make needs these flags entirely ABSENT for "no secure OS",
    # not present-with-empty-value, so a single conditionally-populated var
    # is the minimal way to express that.
    bl32_flags: ""
    # ARM_LINUX_KERNEL_AS_BL33=1 by default — barebox-arm64-poc's proven
    # invocation this command was transcribed from always set it, since it
    # loads BL33 as a raw kernel/EFI payload rather than a real bootloader
    # image (correct for barebox's EFI-mode build). A real bootloader BL33
    # (u-boot, say) is its own BL33 and needs this flag entirely ABSENT, not
    # set to 0 — same conditionally-populated-var trick as bl32_flags: a
    # target overrides bl33_flags to "" for that case.
    bl33_flags: "ARM_LINUX_KERNEL_AS_BL33=1"
    bl33: ""
  command: >-
    make -j${env.JOBS} CROSS_COMPILE=aarch64-linux-gnu- PLAT=${vars.plat} DEBUG=1 -B
    RESET_TO_BL31=1 LOG_LEVEL=30
    ${vars.bl32_flags}
    BL32_RAM_LOCATION=tdram SPD=opteed GENERATE_COT=1 all fip
    ${vars.bl33_flags} BL33=${vars.bl33}
artifacts:
  bl1: build/qemu/debug/bl1.bin
  fip: build/qemu/debug/fip.bin
  qemu_fw: build/qemu/debug/qemu_fw.bios
